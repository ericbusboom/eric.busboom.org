<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-label="Schematic: RP2040-Zero GP2 drives NPN transistor Q1 through R1; Q1 switches the laser's negative lead to ground; the laser's positive lead is on USB 5 V; R2 pulls the base to ground.">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2933; font-size: 17px; }
    .ref { font-weight: 700; }
    .small { font-size: 14px; fill: #52606d; }
    .pin { font-size: 15px; font-weight: 700; }
    .wire { fill: none; stroke: #1f2933; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .power { stroke: #c62828; }
    .signal { stroke: #1565c0; }
    .part { fill: #f5f7fa; stroke: #1f2933; stroke-width: 2.5; }
    .dot { fill: #1f2933; }
  </style>
  <rect width="900" height="510" fill="#ffffff"/>

  <!-- USB -->
  <path class="wire" d="M28 280 H100"/>
  <text x="28" y="268">USB-C</text>
  <text class="small" x="28" y="302">power +</text>
  <text class="small" x="28" y="320">serial</text>

  <!-- U1 -->
  <rect class="part" x="100" y="90" width="170" height="380" rx="6"/>
  <text class="ref" x="185" y="222" text-anchor="middle">U1</text>
  <text x="185" y="248" text-anchor="middle">Waveshare</text>
  <text x="185" y="270" text-anchor="middle">RP2040-Zero</text>
  <text class="small" x="185" y="294" text-anchor="middle">CircuitPython</text>
  <text class="pin" x="258" y="135" text-anchor="end">5V</text>
  <text class="pin" x="258" y="335" text-anchor="end">GP2</text>
  <text class="pin" x="258" y="435" text-anchor="end">GND</text>

  <!-- +5 V rail -->
  <path class="wire power" d="M270 130 H700 V170"/>
  <text x="470" y="118" text-anchor="middle" fill="#c62828" style="fill:#c62828">+5 V from USB</text>

  <!-- Laser -->
  <rect class="part" x="625" y="170" width="150" height="82" rx="6"/>
  <text class="ref" x="700" y="198" text-anchor="middle">L1</text>
  <text x="700" y="220" text-anchor="middle">5 V cross laser</text>
  <text class="small" x="700" y="240" text-anchor="middle">with built-in driver</text>
  <text class="pin" x="712" y="162">+</text>
  <text class="pin" x="712" y="272">−</text>

  <!-- GP2 to base, with R1 -->
  <path class="wire signal" d="M270 330 H390 l6.67 -10 l13.33 20 l13.33 -20 l13.33 20 l13.33 -20 l13.33 20 l6.67 -10 H682"/>
  <text class="ref" x="430" y="302" text-anchor="middle">R1</text>
  <text x="430" y="368" text-anchor="middle">1 kΩ</text>
  <circle class="dot" cx="560" cy="330" r="5"/>

  <!-- R2 -->
  <path class="wire" d="M560 330 V352 l10 5 l-20 10 l20 10 l-20 10 l20 10 l-20 10 l10 5 V430"/>
  <text class="ref" x="580" y="378">R2</text>
  <text x="580" y="400">10 kΩ</text>

  <!-- Q1 -->
  <circle cx="697" cy="330" r="40" fill="#f5f7fa" stroke="#1f2933" stroke-width="2.5"/>
  <path class="wire signal" d="M660 330 H682"/>
  <path d="M682 308 V352" fill="none" stroke="#1f2933" stroke-width="5" stroke-linecap="round"/>
  <path class="wire" d="M682 318 L700 298 V252"/>
  <path class="wire" d="M682 342 L700 362 V430"/>
  <polygon class="dot" points="699,360 686.6,356.2 694.4,349.2"/>
  <text class="ref" x="755" y="322">Q1</text>
  <text x="755" y="344">2N3904 or</text>
  <text x="755" y="366">PN2222A</text>
  <text class="small" x="708" y="290">C</text>
  <text class="small" x="664" y="318">B</text>
  <text class="small" x="708" y="384">E</text>

  <!-- GND rail -->
  <path class="wire" d="M270 430 H700 V452"/>
  <circle class="dot" cx="560" cy="430" r="5"/>
  <path class="wire" d="M678 452 H722 M686 461 H714 M694 470 H706"/>
  <text x="415" y="418" text-anchor="middle">GND</text>
</svg>
