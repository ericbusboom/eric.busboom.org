baseURL = "https://eric.busboom.org/"
languageCode = "en-us"
title = "Eric Busboom"
theme = "wp-static"

[pagination]
pagerSize = 10

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "friendly"

[params]
description = "Thoughts on data, civic life, and public policy"
sidebar = true
showCategories = true
accentColor = "#3b6ea5"

# Blog posts live in date folders (/2009/07/23/...), so their type would be
# the year. Give them all type "post" for the post lists.
[[cascade]]
type = "post"
[cascade.target]
path = "{/20*/**}"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Professional"
url = "/professional/"
weight = 2

[[menu.main]]
name = "Projects"
url = "/projects/"
weight = 3

[[menu.main]]
name = "About"
url = "/about/"
weight = 4
