<script>
(() => {
  // ---------- parts ----------
  const GROUPS = VIEW.groups;
  // keep only the parts this version has
  GROUPS.forEach(g => { g.items = g.items.filter(it => it.meshes.every(([m]) => MESHES[m])); });
  for (let i = GROUPS.length - 1; i >= 0; i--) if (!GROUPS[i].items.length) GROUPS.splice(i, 1);
  const ITEMS = GROUPS.flatMap(g => g.items);
  document.getElementById('title').textContent = VIEW.title;
  document.getElementById('sub').textContent = VIEW.sub;
  document.getElementById('dims').textContent = VIEW.dims;
  document.getElementById('nav').innerHTML = (VIEW.nav || []).map(n => `<a href="${n.href}"${n.href === VIEW.page ? ' aria-current="page"' : ''}>${n.label}</a>`).join('');
  document.getElementById('axes').innerHTML = VIEW.axes || '';
  document.getElementById('views').innerHTML = Object.keys(VIEW.views).map(k => `<button class="btn" data-view="${k}">${VIEW.views[k].label}</button>`).join('');
  ITEMS.forEach(it => { it.def = it.mode || 'on'; it.mode = it.def; it.move = it.move || 0; });

  // ---------- decode meshes (quantized, indexed) into flat-ish shaded geometry ----------
  const b64 = s => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
  const COS = Math.cos(32 * Math.PI / 180);
  function geometry(m) {
    const P = new Int16Array(b64(m.p));
    const I = m.w === 2 ? new Uint16Array(b64(m.i)) : new Uint32Array(b64(m.i));
    const n = I.length, nt = n / 3, nv = P.length / 3;
    const fn = new Float32Array(n);
    for (let t = 0; t < nt; t++) {
      const a = I[3 * t] * 3, b = I[3 * t + 1] * 3, c = I[3 * t + 2] * 3;
      const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2];
      const vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];
      let x = uy * vz - uz * vy, y = uz * vx - ux * vz, z = ux * vy - uy * vx;
      const l = Math.hypot(x, y, z) || 1; fn[3 * t] = x / l; fn[3 * t + 1] = y / l; fn[3 * t + 2] = z / l;
    }
    const cnt = new Uint32Array(nv + 1);
    for (let k = 0; k < n; k++) cnt[I[k] + 1]++;
    for (let v = 0; v < nv; v++) cnt[v + 1] += cnt[v];
    const adj = new Uint32Array(n), fill = cnt.slice(0, nv);
    for (let k = 0; k < n; k++) adj[fill[I[k]]++] = (k / 3) | 0;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
    for (let k = 0; k < n; k++) {
      const v = I[k], t = (k / 3) | 0;
      pos[3 * k] = P[3 * v] * MESH_Q; pos[3 * k + 1] = P[3 * v + 1] * MESH_Q; pos[3 * k + 2] = P[3 * v + 2] * MESH_Q;
      let sx = 0, sy = 0, sz = 0;
      for (let j = cnt[v]; j < cnt[v + 1]; j++) {
        const f = adj[j];
        if (fn[3 * t] * fn[3 * f] + fn[3 * t + 1] * fn[3 * f + 1] + fn[3 * t + 2] * fn[3 * f + 2] > COS) { sx += fn[3 * f]; sy += fn[3 * f + 1]; sz += fn[3 * f + 2]; }
      }
      const l = Math.hypot(sx, sy, sz) || 1; nor[3 * k] = sx / l; nor[3 * k + 1] = sy / l; nor[3 * k + 2] = sz / l;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.computeBoundingSphere();
    return g;
  }

  // ---------- scene ----------
  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.localClippingEnabled = false;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 1, 2000);
  camera.up.set(0, 0, 1);
  scene.add(camera);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f94, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(-0.4, 0.6, 1); camera.add(key);
  const fill2 = new THREE.DirectionalLight(0xffffff, 0.25); fill2.position.set(30, -20, 60); scene.add(fill2);

  const BB = VIEW.bbox, TARGET = new THREE.Vector3(...BB.lo.map((v, i) => (v + BB.hi[i]) / 2));
  const SPAN = Math.hypot(...BB.lo.map((v, i) => BB.hi[i] - v));
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.12; controls.target.copy(TARGET);
  controls.screenSpacePanning = true;

  const clipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const planes = [clipPlane];

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let grid = null;
  const gridHolder = new THREE.Group(); scene.add(gridHolder);
  const cutMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, clippingPlanes: planes });

  const meshList = [];   // for picking
  ITEMS.forEach(it => {
    it.group = new THREE.Group(); scene.add(it.group);
    it.parts = it.meshes.map(([name, color]) => {
      const g = geometry(MESHES[name]);
      const metal = (VIEW.metal || []).includes(name);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: metal ? 0.35 : 0.7, metalness: metal ? 0.45 : 0.0,
        clippingPlanes: planes, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
      const mesh = new THREE.Mesh(g, mat); mesh.userData.item = it;
      const back = new THREE.Mesh(g, cutMat);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 28),
        new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, clippingPlanes: planes }));
      it.group.add(back, mesh, edges); meshList.push(mesh);
      return { mesh, back, edges, mat, base: new THREE.Color(color) };
    });
  });

  function applyTheme() {
    scene.background = new THREE.Color(css('--stage'));
    cutMat.color.set(css('--cut'));
    gridHolder.clear();
    grid = new THREE.GridHelper(Math.ceil(SPAN * 1.6 / 10) * 10, Math.ceil(SPAN * 1.6 / 10), new THREE.Color(css('--grid-a')), new THREE.Color(css('--grid-b')));
    grid.rotation.x = Math.PI / 2; grid.position.set(TARGET.x, TARGET.y, BB.lo[2] - 0.5);
    gridHolder.add(grid);
    gridHolder.visible = document.getElementById('grid').checked;
    const dark = new THREE.Color(css('--stage')).getHSL({}).l < 0.4;
    ITEMS.forEach(it => it.parts.forEach(p => p.edges.material.color.set(dark ? 0x000000 : 0x1d2226)));
    needs = true;
  }

  // ---------- labels ----------
  let labelsOn = true;
  const labelRenderer = new THREE.CSS2DRenderer({ element: document.getElementById('labelLayer') });
  (VIEW.labels || []).forEach(L => {
    const it = ITEMS.find(i => i.id === L.item); if (!it) return;
    const div = document.createElement('div'); div.className = 'tag'; div.textContent = L.text;
    if (L.color) div.style.setProperty('--tc', L.color);
    const o = new THREE.CSS2DObject(div); o.position.set(...L.p); it.group.add(o);
    (it.tags = it.tags || []).push(o);
  });

  // ---------- state ----------
  let explode = 0, cutAxis = 'none', cutFlip = false, cutPos = 0, edgesOn = true, needs = true, hover = null;

  function applyItem(it) {
    const ghost = it.mode === 'ghost', on = it.mode !== 'off';
    it.group.visible = on;
    it.parts.forEach(p => {
      p.mat.transparent = ghost; p.mat.opacity = ghost ? 0.22 : 1; p.mat.depthWrite = !ghost; p.mat.needsUpdate = true;
      p.back.visible = !ghost;
      p.edges.visible = edgesOn; p.edges.material.opacity = ghost ? 0.2 : 0.35;
      p.mat.emissive.set(hover === it ? 0x332200 : 0x000000);
    });
    // an item's own explode vector (mm per mm of slider), else VIEW.explode scaled by move
    const ex = it.move > 0 ? explode : it.move < 0 ? -explode * 0.6 : 0;
    if (it.explode) it.group.position.set(...it.explode.map(v => v * explode));
    else it.group.position.set(...VIEW.explode.map(v => v * ex));
    (it.tags || []).forEach(o => { o.visible = on && labelsOn; });
    const row = document.querySelector(`[data-row="${it.id}"]`);
    if (row) {
      row.classList.toggle('off', !on);
      row.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === it.mode)));
    }
    needs = true;
  }

  function applyCut() {
    const k = { x: 0, y: 1, z: 2 }[cutAxis], range = k === undefined ? [0, 1] : [Math.floor(BB.lo[k]) - 1, Math.ceil(BB.hi[k]) + 1];
    const pos = document.getElementById('cutPos');
    pos.min = range[0]; pos.max = range[1]; pos.disabled = cutAxis === 'none';
    if (cutPos < range[0] || cutPos > range[1]) { cutPos = k === undefined ? 0 : +TARGET.getComponent(k).toFixed(1); }
    pos.value = cutPos;
    document.getElementById('flip').disabled = cutAxis === 'none';
    document.getElementById('cutVal').textContent = cutAxis === 'none' ? '—' : `${cutAxis} ${(+cutPos).toFixed(2)}`;
    renderer.localClippingEnabled = cutAxis !== 'none';
    const s = cutFlip ? -1 : 1;
    // keep the side where normal · p + constant >= 0
    if (cutAxis === 'y') clipPlane.set(new THREE.Vector3(0, s, 0), -s * cutPos);
    if (cutAxis === 'x') clipPlane.set(new THREE.Vector3(-s, 0, 0), s * cutPos);
    if (cutAxis === 'z') clipPlane.set(new THREE.Vector3(0, 0, -s), s * cutPos);
    needs = true;
  }

  // ---------- panel ----------
  const groupsEl = document.getElementById('groups');
  groupsEl.style.display = 'flex'; groupsEl.style.flexDirection = 'column'; groupsEl.style.gap = '18px';
  GROUPS.forEach((g, gi) => {
    const box = document.createElement('section'); box.className = 'group';
    box.innerHTML = `<div class="ghead"><h2>${g.name}</h2><span class="all">
      <button class="link" type="button" data-all="on">All on</button><button class="link" type="button" data-all="off">All off</button></span></div>`;
    box.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => { g.items.forEach(it => { it.mode = b.dataset.all; applyItem(it); }); }));
    g.items.forEach(it => {
      const row = document.createElement('div'); row.className = 'row'; row.dataset.row = it.id;
      const sw = it.meshes[0][1];
      row.innerHTML = `<span class="sw" style="background:${sw}"></span>
        <span class="name">${it.label}${it.note ? `<small>${it.note}</small>` : ''}</span>
        <span class="seg" role="group" aria-label="${it.label}">
          <button type="button" data-mode="on" id="m-${it.id}-on">On</button><button type="button" data-mode="ghost" id="m-${it.id}-ghost">Ghost</button><button type="button" data-mode="off" id="m-${it.id}-off">Off</button>
        </span>`;
      row.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { it.mode = b.dataset.mode; applyItem(it); }));
      box.appendChild(row);
    });
    groupsEl.appendChild(box);
  });

  const $ = id => document.getElementById(id);
  $('explode').addEventListener('input', e => { explode = +e.target.value; $('explodeVal').textContent = `${explode} mm`; ITEMS.forEach(applyItem); });
  $('cut').addEventListener('change', e => { cutAxis = e.target.value; const k = { x: 0, y: 1, z: 2 }[cutAxis]; cutPos = k === undefined ? 0 : +TARGET.getComponent(k).toFixed(1); applyCut(); });
  $('flip').addEventListener('click', () => { cutFlip = !cutFlip; applyCut(); });
  $('cutPos').addEventListener('input', e => { cutPos = +e.target.value; applyCut(); });
  $('edges').addEventListener('change', e => { edgesOn = e.target.checked; ITEMS.forEach(applyItem); });
  $('grid').addEventListener('change', e => { gridHolder.visible = e.target.checked; needs = true; });
  $('labels').addEventListener('change', e => { labelsOn = e.target.checked; ITEMS.forEach(applyItem); });
  $('reset').addEventListener('click', () => {
    ITEMS.forEach(it => it.mode = it.def); explode = 0; $('explode').value = 0; $('explodeVal').textContent = '0 mm';
    cutAxis = 'none'; cutFlip = false; cutPos = 0; $('cut').value = 'none'; edgesOn = true; $('edges').checked = true;
    ITEMS.forEach(applyItem); applyCut(); clearPts(); setView(VIEW.start || 'iso');
  });

  // ---------- camera views ----------
  const VIEWS = Object.fromEntries(Object.entries(VIEW.views).map(([k, v]) => [k, v.dir]));
  function setView(v) {
    const d = new THREE.Vector3(...VIEWS[v]).normalize();
    const dist = SPAN * 1.9 * Math.max(1, 1.3 / Math.max(0.3, canvas.clientWidth / Math.max(1, canvas.clientHeight)));
    controls.target.copy(TARGET);
    camera.position.copy(TARGET).addScaledVector(d, dist);
    controls.update(); needs = true;
  }
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

  // ---------- picking and measuring ----------
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const marks = new THREE.Group(); scene.add(marks);
  let measuring = false, pts = [];
  const readout = $('readout');
  const f2 = v => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2);

  function hitAt(ev) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const vis = meshList.filter(m => m.userData.item.group.visible);
    const hits = ray.intersectObjects(vis, false).filter(h => cutAxis === 'none' || clipPlane.distanceToPoint(h.point) >= -1e-6);
    const solid = hits.find(h => h.object.userData.item.mode === 'on');
    return solid || hits[0] || null;
  }
  function modelPoint(h) { const it = h.object.userData.item; return h.point.clone().sub(it.group.position); }
  function dot(p, col) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 12), new THREE.MeshBasicMaterial({ color: col, depthTest: false }));
    m.position.copy(p); m.renderOrder = 10; marks.add(m);
  }
  function clearPts() { pts = []; marks.clear(); needs = true; }
  $('clearPts').addEventListener('click', () => { clearPts(); readout.innerHTML = '<span class="hint">Cleared.</span>'; });
  $('measure').addEventListener('click', () => {
    measuring = !measuring; $('measure').setAttribute('aria-pressed', String(measuring));
    canvas.classList.toggle('picking', measuring); clearPts();
    readout.innerHTML = measuring ? '<span class="hint">Click the first point.</span>' : '<span class="hint">Measuring off. Click a part to see its name.</span>';
  });

  function onPick(ev) {
    const h = hitAt(ev);
    if (!h) { if (!measuring) { readout.innerHTML = '<span class="hint">Nothing there. Click a part.</span>'; clearPts(); } return; }
    const it = h.object.userData.item, p = modelPoint(h), accent = css('--accent');
    if (!measuring) {
      clearPts(); dot(h.point, accent);
      readout.innerHTML = `<b>${it.label}</b>${it.note ? ` <span class="hint">· ${it.note}</span>` : ''}<br><span class="xyz">x ${f2(p.x)}  y ${f2(p.y)}  z ${f2(p.z)} mm</span>`;
      return;
    }
    if (pts.length >= 2) clearPts();
    pts.push({ p, w: h.point.clone(), it }); dot(h.point, accent);
    if (pts.length === 1) { readout.innerHTML = `<b>${it.label}</b> <span class="xyz">x ${f2(p.x)}  y ${f2(p.y)}  z ${f2(p.z)}</span><br><span class="hint">Click the second point.</span>`; }
    else {
      const [a, b] = pts, d = b.p.clone().sub(a.p);
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.w, b.w]), new THREE.LineBasicMaterial({ color: accent, depthTest: false }));
      line.renderOrder = 9; marks.add(line);
      readout.innerHTML = `<b>${d.length().toFixed(2)} mm</b> <span class="hint">${a.it.label} → ${b.it.label}</span><br><span class="xyz">Δx ${f2(d.x)}  Δy ${f2(d.y)}  Δz ${f2(d.z)}</span>`;
    }
    needs = true;
  }
  let down = null;
  canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5 && e.button === 0) onPick(e); down = null; });
  let hoverQueued = false;
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || e.buttons || hoverQueued) return;
    hoverQueued = true;
    requestAnimationFrame(() => {
      hoverQueued = false;
      const h = hitAt(e), it = h ? h.object.userData.item : null;
      if (it !== hover) {
        const prev = hover; hover = it;
        if (prev) applyItem(prev); if (it) applyItem(it);
        document.querySelectorAll('.row.hot').forEach(r => r.classList.remove('hot'));
        if (it) document.querySelector(`[data-row="${it.id}"]`)?.classList.add('hot');
        canvas.title = it ? it.label : '';
      }
    });
  });
  canvas.addEventListener('pointerleave', () => { if (hover) { const p = hover; hover = null; applyItem(p); document.querySelectorAll('.row.hot').forEach(r => r.classList.remove('hot')); } });

  // ---------- render loop ----------
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); labelRenderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); needs = true;
  }
  new ResizeObserver(resize).observe(canvas);
  controls.addEventListener('change', () => { needs = true; });
  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    if (needs) { needs = false; renderer.render(scene, camera); labelRenderer.render(scene, camera); }
  })();

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  resize(); applyTheme(); ITEMS.forEach(applyItem); applyCut(); setView(VIEW.start || 'iso');
})();
</script>
</body>
</html>
